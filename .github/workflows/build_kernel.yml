name: Build Android Kernel

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target device (目标设备)'
        required: true
        type: choice
        default: 'pipa'
        options:
          - 'umi'
          - 'cmi'
          - 'cas'
          - 'thyme'
          - 'munch'
          - 'dagu'
          - 'elish'
          - 'enuma'
          - 'alioth'
          - 'apollo'
          - 'lmi'
          - 'psyche'
          - 'pipa'
      kernelsu_enabled:
        description: 'Enable KernelSU (是否启用 KernelSU)'
        required: true
        type: choice
        default: 'Yes'
        options:
          - 'Yes'
          - 'No'

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: 🧐 Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🙌 Set build variables
        run: |
          if [ "${{ github.event.inputs.kernelsu_enabled }}" = "Yes" ]; then
            echo "KSU_ARG=ksu" >> $GITHUB_ENV
            echo "KSU_STR=KernelSU" >> $GITHUB_ENV
          else
            echo "KSU_ARG=" >> $GITHUB_ENV
            echo "KSU_STR=NoKSU" >> $GITHUB_ENV
          fi
          echo "DEVICE=${{ github.event.inputs.target_device }}" >> $GITHUB_ENV

      - name: 🤖 Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3

      - name: ⬇️ Download Proton Clang Toolchain
        run: |
          mkdir -p $HOME/proton-clang
          cd $HOME/proton-clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip 20210522.zip
          cd -

      - name: 🔧 Build Kernel
        run: |
          bash build.sh $DEVICE $KSU_ARG

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          path: kernel_source/*.zip
        
      - name: 🚀 Release kernel zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_id }}-${{ github.event.inputs.target_device }}
          name: "Kernel Build ${{ github.run_id }} for ${{ github.event.inputs.target_device }}"
          body: |
            ## Information
            - 设备: ${{ github.event.inputs.target_device }}
            - KSU: ${{ github.event.inputs.kernelsu_enabled }}
            - 构建ID: ${{ github.run_id }}

            ## Install
            - 下载内核安装包
            - 使用 Kernel Flasher 等软件刷入 AK3 压缩包
          files: kernel_source/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
